
name: Windows Double Precision Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  build:
    name: Build Godot3DTiles Extension
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.8
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Install SCons
      run: pip install scons

    - name: Setup MSVC 2022
      uses: microsoft/setup-msbuild@v1.3
      with:
        vs-version: '17.7'
        include-optional: true

    - name: Build Extension (Double Precision Debug)
      run: scons platform=windows arch=x64 compileTarget=extension target=template_release buildCesium=true precision=double dev_build=yes

    - name: Verify Build Output
      run: if ((gci godot3dtiles/addons/cesium_godot/lib -Filter "*.dll").Count -lt 1) { exit 1 }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: godot3dtiles-double-precision-dev
        path: godot3dtiles/
